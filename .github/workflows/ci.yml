# 自动测试：每个 PR、以及合并进 main 之后，都在 GitHub 的服务器上跑测试。
# 分支保护要求这里的检查（scope、test (3.9)、test (3.12)）通过，PR 才能合并。
#
# 跑哪些测试由 scripts/changes.py 按改动决定：只改了一个项目就只跑平台测试 + 这个项目的测试；
# 改了平台代码就全部跑。负责人手动合并进 main 时会全部跑一遍（自动合并由机器人完成，不会触发）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 手动重跑测试用：在 Actions 页面选分支运行，base 填和哪个提交比较（留空则全部测试）
  workflow_dispatch:
    inputs:
      base:
        description: 和哪个提交比较来选测试、检查范围（一般是 main 的最新提交）
        required: false

permissions:
  contents: read

jobs:
  # 算出要跑哪些测试
  changes:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            targets=$(python3 scripts/changes.py tests --base "$BASE")
          else
            targets="."
          fi
          echo "要跑的测试：$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  # 一个 PR 只能改一个项目，或者只改平台
  scope:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.base != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python3 scripts/changes.py scope --base "$BASE"

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = 负责人本地的版本（代码必须兼容）；3.12 = Render 线上的版本
        python-version: ["3.9", "3.12"]
    # 用官方 Python 镜像跑：GitHub 新版 Ubuntu 上已经装不了 3.9 这类旧版本
    container: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v5
      - run: pip install -r requirements-dev.txt
      - env:
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: python -m pytest -q $TARGETS
