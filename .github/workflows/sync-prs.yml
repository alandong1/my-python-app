# main 有新提交时，自动把 main 合并进所有落后的 PR，并重新跑测试。
#
# 为什么需要：分支保护要求「合并前分支必须是最新」。多个 agent 同时开 PR 时，
# 一个 PR 合并后，其他 PR 就都落后了，会卡住等人同步。
#
# 为什么要手动触发 CI：用 GITHUB_TOKEN 推送的提交不会触发其他 workflow
# （GitHub 防止 workflow 互相触发死循环），只有 workflow_dispatch 例外。
# 所以同步之后要主动触发 ci.yml，并给负责人的 PR 重新 approve。
#
# 跳过：别人 fork 来的 PR（负责人人工处理）、草稿 PR、带 needs-human 标签的 PR。
# 有冲突的 PR 无法自动同步：留言提醒，由 PR 的作者（agent）手动合并 main、解决冲突。
#
# 机器人推送的合并提交会触发一次 CI，但公开仓库会把机器人当作外部贡献者，
# 这次 CI 停在「等待维护者批准」（action_required），而且会挡住合并。
# 所以对负责人本人的 PR，同步后把这种等批准的 CI 直接批准掉（只批准 PR 当前最新提交上的）。
name: Sync PRs with main

on:
  # 负责人手动合并 PR 时会触发
  push:
    branches: [main]
  # 自动合并的 PR 是 github-actions 机器人合并的，它的推送不会触发其他 workflow，
  # 所以靠定时检查兜底（GitHub 的定时任务可能晚几分钟）
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-prs
  cancel-in-progress: false   # 排队执行，不要中途打断正在同步的任务

permissions:
  contents: write        # 把 main 合并进 PR 分支
  pull-requests: write   # approve、留言
  actions: write         # 触发 ci.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Update open PRs
        run: |
          set -uo pipefail
          MAIN_SHA=$(gh api "repos/$GH_REPO/commits/main" -q .sha)
          prs=$(gh pr list --base main --state open --limit 100 \
            --json number,headRefName,headRefOid,isDraft,isCrossRepository,author,labels \
            -q '.[] | select((.isDraft | not) and (.isCrossRepository | not)
                             and ([.labels[].name] | index("needs-human") | not))
                    | [.number, .headRefName, .headRefOid, .author.login] | @tsv')
          if [ -z "$prs" ]; then echo "没有需要同步的 PR"; exit 0; fi

          # 批准 PR 最新提交上「等待维护者批准」的 CI；最多等 tries*3 秒让它出现
          approve_waiting_runs() {
            local num="$1" branch="$2" sha="$3" tries="$4" ids=""
            for _ in $(seq 1 "$tries"); do
              ids=$(gh run list --branch "$branch" --limit 20 --json databaseId,conclusion,headSha \
                -q ".[] | select(.conclusion == \"action_required\" and .headSha == \"$sha\") | .databaseId")
              [ -n "$ids" ] && break
              [ "$tries" -gt 1 ] && sleep 3
            done
            for id in $ids; do
              if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null 2>&1; then
                echo "#$num 批准了等待中的 CI（run $id）"
              else
                echo "#$num ⚠️ 无法批准 CI（run $id），需要负责人在 PR 页面点 Approve and run"
              fi
            done
          }

          while IFS=$'\t' read -r num branch head author; do
            # 之前同步留下、还卡在「等批准」的 CI，先处理掉
            if [ "$author" = "$OWNER" ]; then approve_waiting_runs "$num" "$branch" "$head" 1; fi

            behind=$(gh api "repos/$GH_REPO/compare/$head...$MAIN_SHA" -q .ahead_by)
            if [ "$behind" = "0" ]; then echo "#$num 已经是最新"; continue; fi

            echo "#$num 落后 main $behind 个提交，同步中..."
            if ! out=$(gh api -X PUT "repos/$GH_REPO/pulls/$num/update-branch" -f expected_head_sha="$head" 2>&1); then
              echo "#$num 无法自动同步：$out"
              marker="<!-- sync-prs:conflict:$MAIN_SHA -->"
              if ! gh pr view "$num" --json comments -q '.comments[].body' | grep -qF "sync-prs:conflict"; then
                gh pr comment "$num" --body "⚠️ 这个 PR 和最新的 \`main\` 有冲突，无法自动同步。请在分支上合并最新的 \`main\`、解决冲突后再 push。
          $marker"
              fi
              continue
            fi

            # 同步是异步完成的：等 PR 的 head 变成新的提交
            new="$head"
            for _ in $(seq 1 30); do
              sleep 3
              new=$(gh pr view "$num" --json headRefOid -q .headRefOid)
              [ "$new" != "$head" ] && break
            done
            if [ "$new" = "$head" ]; then echo "#$num 同步超时，跳过"; continue; fi

            gh workflow run ci.yml --ref "$branch" -f base="$MAIN_SHA"
            if [ "$author" = "$OWNER" ]; then
              gh pr review "$num" --approve --body "同步了最新的 main，按规则重新 approve（负责人本人的 PR）。"
              approve_waiting_runs "$num" "$branch" "$new" 10
            fi
            echo "#$num 已同步到 ${new:0:7}，已触发 CI"
          done <<< "$prs"
