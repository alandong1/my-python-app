<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
  <link rel="stylesheet" href="/static/store.css">
</head>
<body>
  <header class="top">
    <a href="/" class="logo">🧪 Dev Lab</a>
    <span class="spacer"></span>
    <button id="loginBtn" class="primary" hidden>登录</button>
    <button id="accountBtn" hidden>👤 <span id="accountName"></span></button>
  </header>

  <main>
    <section class="hero">
      <h1>Dev Lab</h1>
      <p>我的项目实验室：游戏、工具和 AI，都在这里开发和测试。</p>
    </section>
    <nav id="filters" class="filters"></nav>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <footer><span id="version"></span></footer>

  <!-- 登录 -->
  <div id="loginModal" class="modal" hidden>
    <div class="box">
      <button class="close" data-close aria-label="关闭">×</button>
      <h2>登录 Dev Lab</h2>
      <p class="muted">一个账号，所有项目通用</p>
      <button id="guestBtn" class="big primary">🎮 游客进入</button>
      <small class="muted">游客身份保存在当前浏览器，换设备或清除数据后无法找回</small>
      <div class="divider"><span>或使用账号</span></div>
      <div class="tabs">
        <button data-tab="loginForm" class="active">登录</button>
        <button data-tab="registerForm">注册</button>
      </div>
      <form id="loginForm">
        <input name="username" placeholder="用户名或邮箱" autocomplete="username" required>
        <input name="password" type="password" placeholder="密码" autocomplete="current-password" required>
        <button class="big">登录</button>
      </form>
      <form id="registerForm" hidden>
        <input name="username" placeholder="用户名（3–20 位，可用中文）" autocomplete="username" required>
        <input name="password" type="password" placeholder="密码（至少 8 位）" autocomplete="new-password" required>
        <input name="email" type="email" placeholder="邮箱（可选，用于找回账号）" autocomplete="email">
        <button class="big">注册</button>
      </form>
      <div id="oauthBox" hidden>
        <div class="divider"><span>第三方登录</span></div>
        <div id="oauthBtns"></div>
      </div>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <!-- 我的账号 -->
  <div id="accountModal" class="modal" hidden>
    <div class="box left">
      <button class="close" data-close aria-label="关闭">×</button>
      <h2>👤 我的账号</h2>
      <div id="accountBody"></div>
      <button id="logoutBtn">退出登录</button>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/static/store.js"></script>
</body>
</html>
