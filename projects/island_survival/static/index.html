<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>荒岛求生 · Dev Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
  <link rel="stylesheet" href="static/style.css">
  <!-- Three.js r160（3D 库）放在本站 static/vendor/ 下，不依赖外部 CDN -->
  <script type="importmap">
    {"imports": {"three": "./static/vendor/three.module.min.js"}}
  </script>
</head>
<body>

  <!-- 第一步：选角色 -->
  <section id="pick" class="screen">
    <div class="panel">
      <h1>🏝️ 荒岛求生</h1>
      <p class="lead">一场海难把你冲到了一座无人荒岛上。选一个角色，和岛上的其他幸存者一起活下去。</p>
      <div class="roles">
        <button class="role" data-role="chef">
          <span class="emoji">🧑‍🍳</span>
          <b>厨师</b>
          <small>做饭时自己额外吃饱 15 点。</small>
        </button>
        <button class="role" data-role="doctor">
          <span class="emoji">🩺</span>
          <b>医生</b>
          <small>把草本植物制成草药，治疗队友和疾病。</small>
        </button>
        <button class="role" data-role="priest">
          <span class="emoji">⛪</span>
          <b>牧师</b>
          <small>精神下降得慢，还能给身边的队友恢复精神。</small>
        </button>
      </div>
      <p id="pickMsg" class="msg"></p>
      <p class="hint">你会随机落在岛上的某个地方。</p>
    </div>
  </section>

  <!-- 第二步：游戏画面 -->
  <section id="game" hidden>
    <canvas id="scene"></canvas>

    <div id="hud-left" class="hud">
      <div class="rings">
        <div class="ring">
          <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle id="ringHunger" class="fg" cx="18" cy="18" r="15"/></svg>
          <span class="icon">🍖</span><b id="valHunger"></b>
        </div>
        <div class="ring">
          <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle id="ringHealth" class="fg" cx="18" cy="18" r="15"/></svg>
          <span class="icon">❤️</span><b id="valHealth"></b>
        </div>
        <div class="ring">
          <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle id="ringSanity" class="fg" cx="18" cy="18" r="15"/></svg>
          <span class="icon">🧠</span><b id="valSanity"></b>
        </div>
        <span id="sickBadge" class="badge" hidden>🤒</span>
      </div>
      <div id="clock" class="small"></div>
      <div class="who small"><span id="roleName"></span> · <span id="meName"></span></div>
      <div id="gear" class="small"></div>
      <div id="survivors" hidden></div>
    </div>

    <div id="hud-right" class="card">
      <button id="invToggle" class="inv-toggle">🎒 背包 <span id="invCount"></span> <span id="invArrow">▸</span></button>
      <ul id="inv" hidden></ul>
    </div>

    <div id="log" class="card" title="点一下展开 / 收起"></div>
    <div id="toast" hidden></div>

    <div id="houseBar" class="card" hidden>🏠 在屋里 · 按 Q 出屋 · 按 E 拿回附近的家具</div>

    <!-- 互动按钮：不在底部，而是贴在目标旁边（由 game.js 的 placeInteract 摆放） -->
    <button id="interactBtn" title="E" hidden>互动 E</button>

    <!-- 底部按钮：常驻的只有合成和建造；其他的只在附近有对应东西时才显示（见 game.js 的 updateActions） -->
    <div id="actions">
      <button data-action="build" title="B">建造 B</button>
      <button data-action="farm" title="G" hidden>种田 G</button>
      <button data-action="heal" title="H" hidden>治疗 H</button>
      <button data-action="exit" title="Q" hidden>出屋 Q</button>
    </div>

    <div id="menu" hidden>
      <div class="panel menu-panel">
        <div class="menu-head"><h2 id="menuTitle"></h2><button id="menuClose">关闭</button></div>
        <div id="menuTabs" class="tabs" hidden></div>
        <ul id="menuList"></ul>
      </div>
    </div>

    <div id="joy"><div id="knob"></div></div>
    <div id="keys" class="small">WASD 移动 · 拖动转视角 · E 互动 · T 合成 · B 建造 · C 做饭 · G 种田 · F 加柴 · U 升级</div>

    <div id="dead" hidden>
      <div class="panel">
        <h2>💀 你倒下了</h2>
        <p>岛上的风还在吹。点下面的按钮，在岛上另一个地方重新开始。</p>
        <button id="respawnBtn">重新开始</button>
      </div>
    </div>
  </section>

  <script type="module" src="static/game.js"></script>
</body>
</html>
