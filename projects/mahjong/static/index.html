<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>麻将小游戏</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main id="app">
    <!-- 大厅：账号信息、继续游戏、建房、加入、公开房间、排行榜、积分商城 -->
    <section id="lobby" class="panel lobby">
      <h1>🀄 麻将小游戏</h1>
      <div id="me" class="me-card muted"></div>

      <div id="resume-box" class="resume hidden">
        <p>你有一局正在进行的游戏。</p>
        <button id="btn-resume" class="primary">继续游戏</button>
      </div>

      <div class="block">
        <h2>开一局</h2>
        <label class="field">玩法
          <select id="rule-lobby"></select>
        </label>
        <p id="rule-note" class="muted"></p>
        <label class="field">局数
          <select id="rounds-lobby">
            <option value="1">1 局</option>
            <option value="4" selected>4 局</option>
            <option value="8">8 局</option>
          </select>
        </label>
        <label class="field">房间
          <select id="visibility-lobby">
            <option value="public" selected>公开（显示在大厅）</option>
            <option value="private">私密（只能用四位房间号加入）</option>
          </select>
        </label>
        <label class="field check">
          <span>启用道具（和电脑玩或建房时）</span>
          <input id="items-lobby" type="checkbox">
        </label>
        <div class="row">
          <button id="btn-solo">和电脑玩</button>
          <button id="btn-create" class="primary">创建房间</button>
        </div>
        <div class="row join">
          <input id="code" maxlength="4" inputmode="numeric" placeholder="四位房间号">
          <button id="btn-join">加入房间</button>
        </div>
      </div>

      <div class="block">
        <h2>公开房间</h2>
        <ul id="public-rooms" class="seats-list"></ul>
      </div>

      <div class="block">
        <h2>排行榜（总积分）</h2>
        <ol id="leaderboard" class="board-list"></ol>
      </div>

      <div class="block">
        <h2>积分商城</h2>
        <div id="shop" class="shop"></div>
        <p class="muted">开局时房主可以勾选「启用道具」。道具在自己回合摸牌前使用，用完即消失。</p>
      </div>
    </section>

    <!-- 房间：等人、补位、开始 -->
    <section id="room" class="panel hidden">
      <h2>房间 <span id="room-code" class="code"></span> <span id="room-vis" class="muted"></span></h2>
      <p class="muted">把房间号发给朋友，他在大厅输入就能加入。没坐满的座位，开始时由电脑补上。</p>
      <ul id="room-seats" class="seats-list"></ul>
      <label class="field">局数
        <select id="rounds">
          <option value="1">1 局</option>
          <option value="4">4 局</option>
          <option value="8">8 局</option>
        </select>
      </label>
      <label class="field">房间
        <select id="visibility">
          <option value="public">公开（显示在大厅）</option>
          <option value="private">私密（只能用房间号加入）</option>
        </select>
      </label>
      <label class="field check">
        <span>启用道具</span>
        <input id="items" type="checkbox">
      </label>
      <div class="row">
        <button id="btn-start" class="primary">开始游戏</button>
        <button id="btn-leave">离开房间</button>
      </div>
    </section>

    <!-- 牌桌 -->
    <section id="table" class="hidden">
      <div class="topbar">
        <span id="info"></span>
        <button id="btn-quit" class="small">离开</button>
      </div>
      <div class="board">
        <div id="seat-top" class="seat"></div>
        <div id="seat-left" class="seat side"></div>
        <div id="center" class="center"></div>
        <div id="seat-right" class="seat side"></div>
        <div id="seat-bottom" class="seat me"></div>
      </div>
      <div id="actions" class="actions"></div>
      <p id="hint" class="hint"></p>
      <div id="notes" class="notes"></div>
      <!-- 计分板：每一局的胡牌牌型，点开可以回顾 -->
      <details id="scoreboard" class="scoreboard">
        <summary>计分板（每局的牌型，点开看详情）</summary>
        <div id="score-list"></div>
      </details>
    </section>

    <!-- 一局结束 / 整场结束 -->
    <div id="overlay" class="overlay hidden">
      <div class="card" id="overlay-card"></div>
    </div>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="static/game.js"></script>
</body>
</html>
