<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title data-i18n>突击行动 · Dev Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔫</text></svg>">
  <link rel="stylesheet" href="static/style.css">
  <script type="importmap">
  {"imports": {
    "three": "./static/vendor/three.module.min.js",
    "three/addons/": "./static/vendor/addons/"
  }}
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- 顶部栏：始终可见 -->
  <header id="topbar">
    <a href="/" class="home ui-btn" data-i18n-title="返回 Dev Lab">🏠</a>
    <span class="title" data-i18n>突击行动</span>
    <span class="spacer"></span>
    <button id="fullBtn" class="ui-btn hidden" data-i18n>全屏</button>
    <button data-lang-toggle class="lang-toggle ui-btn"></button>
  </header>

  <!-- 游戏中的 HUD（进入房间后显示）。文字不接收触摸，只有带 ui-btn 的按钮会接收 -->
  <div id="hud" class="hidden">
    <div id="roomBar" class="hidden">
      <span id="roomTitle"></span>
      <button id="botAddBtn" class="ui-btn host-only" data-i18n>+电脑</button>
      <button id="botDelBtn" class="ui-btn host-only" data-i18n>-电脑</button>
      <button id="disbandBtn" class="ui-btn host-only" data-i18n>解散房间</button>
    </div>
    <div id="stats"><span><span data-i18n>击杀</span> <b id="kills">0</b></span><span><span data-i18n>死亡</span> <b id="deaths">0</b></span><span><span data-i18n>金钱</span> <b id="money">$0</b></span><span id="teamScores"></span></div>
    <div id="hpbar"><div id="hpfill"></div><span id="hptext">100</span></div>
    <div id="feed"></div>
    <div id="crosshair"></div>
    <div id="scopeOverlay" class="hidden"></div>
    <div id="hitmark"></div>
    <div id="hurt"></div>
    <div id="dead" class="hidden"><b data-i18n>你被击败了</b><span id="respawn"></span></div>
    <div id="hint" data-i18n></div>

    <div id="scoreboard" class="hidden">
      <div class="sb-title" data-i18n>记分板</div>
      <table><thead><tr><th data-i18n>名字</th><th data-i18n>击杀</th><th data-i18n>死亡</th></tr></thead><tbody id="rows"></tbody></table>
    </div>

    <div class="hud-buttons">
      <button id="shopBtn" class="ui-btn" data-i18n>商店</button>
      <button id="scoreBtn" class="ui-btn touch-only" data-i18n>记分</button>
      <button id="leaveBtn" class="ui-btn" data-i18n>离开</button>
    </div>
    <div id="weaponName"></div>
    <button id="swapBtn" class="ui-btn touch-only" data-i18n>换枪</button>
    <button id="scopeBtn" class="ui-btn touch-only hidden" data-i18n>瞄准</button>

    <div id="joyBase" class="touch-only hidden"><div id="joyKnob"></div></div>
    <button id="fireBtn" class="ui-btn touch-only" data-i18n>开火</button>
  </div>

  <!-- 进入界面 -->
  <main id="menu">
    <div class="card lobby">
      <h1>🔫 <span data-i18n>突击行动</span></h1>
      <p class="sub"><span data-i18n>大厅</span> · <b id="myName"></b></p>
      <div class="create">
        <input id="roomName" maxlength="16" autocomplete="off" data-i18n-ph="房间名（可不填）">
        <button id="createBtn" class="primary" data-i18n>建房间</button>
      </div>
      <p id="createHint" class="hint"></p>
      <button id="backRoomBtn" class="ui-btn hidden" data-i18n>回到我的房间</button>
      <p id="status" role="status"></p>
      <button id="reconnectBtn" class="ui-btn hidden" data-i18n>重新连接</button>
      <div id="roomList" class="room-list"></div>
      <div class="help">
        <p><b data-i18n>电脑：</b><span data-i18n>W A S D 移动，鼠标转向，左键开火，右键瞄准，1 / 2 换枪，B 商店，Tab 看记分板，Esc 释放鼠标。</span></p>
        <p><b data-i18n>手机：</b><span data-i18n>左下角拖动移动，右半边屏幕滑动转向，右下角按住开火。</span></p>
        <p data-i18n>注册账号后才能建房；游客可以加入别人的房间。房主关闭网页不会解散房间，只有房主主动解散才会关闭。</p>
      </div>
    </div>
  </main>

  <!-- 商店：点「商店」或按 B 打开 -->
  <div id="shop" class="hidden">
    <div class="shop-card">
      <div class="shop-head"><b data-i18n>商店</b><span id="shopMoney"></span><button id="shopClose" class="ui-btn" data-i18n>关闭</button></div>
      <p id="shopNote" class="shop-note"></p>
      <div id="shopList"></div>
      <p class="shop-help" data-i18n>购买后自动装备，替换同一槽位的武器。电脑按 1 / 2 切换主武器和副武器，按 B 开关商店。</p>
    </div>
  </div>

  <script src="/static/i18n.js"></script>
  <script src="static/lang.js"></script>
  <script type="module" src="static/game.js"></script>
</body>
</html>
